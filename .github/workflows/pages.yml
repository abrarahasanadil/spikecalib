name: pages

# Deploys docs/ to GitHub Pages when started by hand (Actions -> pages -> Run workflow).
#
# It runs only on request: Pages must first be enabled for the repository
# (Settings -> Pages -> Build and deployment -> Source: GitHub Actions), and the
# site is not meant to go live until the preprint is. Enabling Pages and running
# this workflow are separate, manual decisions.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queue rather than cancel, so a push mid-deploy
# does not leave the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the site is self-contained
        # The site is plain HTML and CSS with no build step, so the only way it
        # breaks is a missing asset. Fail here rather than shipping a page with
        # broken figures.
        run: |
          for f in index.html style.css app.js data.js sweep.csv; do
            test -f "docs/$f" || { echo "missing docs/$f"; exit 1; }
          done
          # data.js is generated from results/; a stale or empty one would leave the
          # dashboard rendering nothing, which is worse than failing here.
          grep -q "window.SPIKECALIB_CSV" docs/data.js || { echo "docs/data.js has no CSV payload"; exit 1; }
          grep -q "window.SPIKECALIB" docs/data.js || { echo "docs/data.js has no payload"; exit 1; }
          echo "all assets present"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
